name: One-time concise v0.6.1 draft release notes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-v061-short-draft.yml'

permissions:
  contents: write

jobs:
  update-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Update only existing draft release description
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const releaseId = 425483586;
            const { data: current } = await github.rest.repos.getRelease({ owner, repo, release_id: releaseId });
            const requiredNames = [
              'DLSS5ForUE5-v0.6.1-UE5.5-Editor-Win64.zip',
              'DLSS5ForUE5-v0.6.1-UE5.6-Editor-Win64.zip',
              'DLSS5ForUE5-v0.6.1-UE5.7-Editor-Win64.zip',
              'DLSS5ForUE5-v0.6.1-UE5.8-Editor-Win64.zip'
            ];
            const expectedDigests = [
              'sha256:8c563b551a7866f3fcf7fe2faee638e6a9d9dac5cd722a4548aecab18487e61e',
              'sha256:ce66c0b2c05347267935b4b192d0f6278dfa9c0594b4cdda4887db6133205f32',
              'sha256:4d0574ce339823176727851cfb1fd9382811aa5f7a0c88784a8e83d9e3336cc9',
              'sha256:99ae49696048f618c8887fc77f217d048a4758d08339c0c3417a609bc8c53c7a'
            ];
            if (!current.draft || current.name !== 'DLSS5ForUE5 v0.6.1' ||
                current.assets.length !== 4 ||
                requiredNames.some((n, i) => !current.assets.some(a => a.name === n && a.digest === expectedDigests[i]))) {
              core.setFailed('Draft state/name/assets do not match the validated input. No changes made.');
              return;
            }
            const body = "## Highlights\n\n- Updated NVIDIA Neural Rendering runtime to **310.9.16.0**.\n- **Movie Render Queue:** Maintainer-confirmed Neural Rendering in UE 5.6 and UE 5.8.\n- Improved motion-vector guidance and depth/motion alignment.\n- Added optional highlight preservation for brighter emissive and specular details.\n- Improved Editor CVar synchronization and rendering stability.\n- Editor Win64 builds for **Unreal Engine 5.5–5.8**.\n\n## Contribution acknowledgement\n\nThanks to [@scragnog](https://github.com/scragnog) for the GPU-safe NR lifetime and temporal-history improvements in [PR #2](https://github.com/praveenkumarappu/DLSS5ForUE5/pull/2), and the contributions incorporated from the still-open [PR #5](https://github.com/praveenkumarappu/DLSS5ForUE5/pull/5), including motion guides, highlight preservation and Editor CVar improvements. PR #5 remains open.\n";
            const { data: updated } = await github.rest.repos.updateRelease({
              owner, repo, release_id: releaseId,
              tag_name: 'v0.6.1', target_commitish: 'main', body
            });
            if (!updated.draft || updated.body !== body || updated.assets.length !== 4 || updated.tag_name !== 'v0.6.1') {
              core.setFailed('Draft update result differs from expected content/tag/draft/assets. Review release.');
              return;
            }
            core.info('Draft description updated. Four source-verified binary ZIPs remain attached. Release NOT published.');
