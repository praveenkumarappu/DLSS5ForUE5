name: Public source hygiene

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  text-audit:
    name: Encoding and public source check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check tracked text files
        run: python3 Scripts/check_public_text.py
