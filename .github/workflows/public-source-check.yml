name: Public source hygiene

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  text-audit:
    name: Encoding and public source check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check tracked text files
        run: python3 Scripts/check_public_text.py
      - name: Validate release documentation contract
        run: python3 Scripts/check_release_contract.py
      - name: Parse PowerShell project installer
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "INSTALL_TO_PROJECT.ps1"),
            [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
