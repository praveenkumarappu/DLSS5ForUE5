name: One-time restore v0.6.1 draft tag label

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-v061-draft-notes-once.yml'

permissions:
  contents: write

jobs:
  restore-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Set tag label for existing draft, without publishing
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const releaseId = 425483586;
            const result = await github.rest.repos.getRelease({
              owner, repo, release_id: releaseId
            });
            const draft = result.data;
            if (!draft.draft || draft.name !== 'DLSS5ForUE5 v0.6.1') {
              core.setFailed('Existing release must remain the v0.6.1 draft.');
              return;
            }
            if (draft.assets.length !== 4 || !draft.body.includes('## Compatibility') ||
                draft.body.includes('**Rebuilt for UE 5.5')) {
              core.setFailed('Draft assets/description failed verification.');
              return;
            }
            if (draft.tag_name === 'v0.6.1') {
              core.info('Draft tag label is already correct.');
              return;
            }
            const updated = await github.rest.repos.updateRelease({
              owner, repo, release_id: releaseId, tag_name: 'v0.6.1',
              target_commitish: 'main'
            });
            if (updated.data.tag_name !== 'v0.6.1' || !updated.data.draft ||
                updated.data.assets.length !== 4) {
              core.setFailed('Draft tag label update was not verified.');
              return;
            }
            core.info('Restored tag label v0.6.1. Four assets preserved. No publication.');
